plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'azerya-worldgen' }

loom {
    mods {
        azerya_worldgen { sourceSet sourceSets.main }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.register('geographyChecks', JavaExec) {
    group = 'verification'
    description = 'Checks deterministic geography across seeds and chunk boundaries.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'fr.azerya.worldgen.geo.GeographyChecks'
}
tasks.named('check') { dependsOn tasks.named('geographyChecks') }

// Verification uses the standalone geographyChecks entry point above.
tasks.named('test') { failOnNoDiscoveredTests = false }
